{{ define "head" }}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
 {"@type":"WebSite","@id":"{{ .Permalink }}#website","url":"{{ .Permalink }}","name":"{{ site.Title }}","inLanguage":"pt-BR"},
 {"@type":"WebApplication","name":"{{ site.Title }}","url":"{{ .Permalink }}","applicationCategory":"MusicApplication","operatingSystem":"Web","browserRequirements":"Requires JavaScript","inLanguage":"pt-BR","isAccessibleForFree":true,"image":"{{ "og.png" | absURL }}","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"{{ site.Params.description }}"}
 {{- with .Params.faq }},
 {"@type":"FAQPage","mainEntity":[
 {{- range $i, $f := . }}{{ if $i }},{{ end }}{"@type":"Question","name":{{ $f.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ $f.a | markdownify | plainify | jsonify }}}}{{ end }}
 ]}{{ end }}
]}
</script>
{{ end }}
{{ define "header-actions" }}{{ partial "header-actions.html" . }}{{ end }}
{{ define "main" }}{{ partial "metronome-page.html" . }}{{ end }}
{{ define "scripts" }}{{ partial "metronome-scripts.html" . }}{{ end }}
