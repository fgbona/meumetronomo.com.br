{{- /* Bloco de anúncio AdSense. Uso: {{ partial "ad.html" (dict "slot" "1234567890") }}
       Só renderiza se params.adsense.client estiver preenchido no hugo.toml. */ -}}
{{- with site.Params.adsense.client }}{{- with $.slot }}
<div class="ad">
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ site.Params.adsense.client }}" data-ad-slot="{{ . }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{{- end }}{{- end }}
