<section class="card" id="scales">
  <div class="form">
    <label class="opt"><span>Tônica</span> <select id="scale-root" aria-label="Tônica"></select></label>
    <label class="opt"><span>Escala</span> <select id="scale-type" aria-label="Tipo de escala"></select></label>
    <button id="scale-play" type="button">Ouvir</button>
  </div>
  <div class="pills" id="scale-notes"></div>
  <p class="status">Fórmula: <strong id="scale-formula"></strong> (T = tom, ST = semitom)</p>
  <div id="scale-chords-wrap">
    <p class="status">Acordes (tríades) de cada grau</p>
    <div class="pills" id="scale-chords"></div>
  </div>
</section>
