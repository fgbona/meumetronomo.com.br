<section class="card" id="tone">
  <div class="big"><span id="tone-out">440.00 Hz</span><small>frequência atual</small></div>
  <div class="form">
    <label class="opt"><span>Lá 4 =</span> <input id="tone-a4" type="number" min="400" max="480" value="440" aria-label="Frequência do Lá 4"> <span>Hz</span></label>
    <label class="opt"><span>Oitava</span>
      <select id="tone-oct" aria-label="Oitava"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
    </label>
    <label class="opt"><span>Timbre</span>
      <select id="tone-wave" aria-label="Forma de onda"><option value="sine">Senoide (puro)</option><option value="triangle">Triangular</option><option value="sawtooth">Dente de serra</option><option value="square">Quadrada</option></select>
    </label>
  </div>
  <div class="notes" id="tone-notes"></div>
  <div class="form">
    <label class="opt"><span>Frequência livre</span> <input id="tone-hz" type="number" min="20" max="20000" value="432" step="0.1" aria-label="Frequência em Hz"> <span>Hz</span></label>
    <button id="tone-play" type="button">Tocar / parar</button>
    <button id="tone-stop" type="button">Silenciar</button>
  </div>
</section>
