<section class="card tuner" id="tuner">
  <div class="big"><span id="tuner-note">–</span><small id="tuner-cents">toque uma nota</small></div>
  <div class="tuner-meter"><div class="tuner-needle" id="tuner-needle"></div></div>
  <div class="tuner-scale"><span>−50</span><span>♭</span><span>0</span><span>♯</span><span>+50</span></div>
  <p class="status" id="tuner-hz"></p>
  <div class="controls"><button id="tuner-start" class="primary" type="button">Ativar microfone</button></div>
  <div class="form">
    <label class="opt"><span>Lá de referência</span> <input id="tuner-a4" type="number" min="400" max="480" value="440" aria-label="Frequência do Lá 4"> <span>Hz</span></label>
  </div>
  <p class="status" id="tuner-status">O som é analisado no seu aparelho e não é gravado nem enviado.</p>
</section>
