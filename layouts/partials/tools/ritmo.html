<section class="card" id="rhythm">
  <div class="form">
    <label class="opt"><span>BPM</span> <input id="rhythm-bpm" type="number" min="20" max="240" value="80" aria-label="BPM"></label>
    <label class="opt"><span>Batidas</span> <input id="rhythm-beats" type="number" min="1" max="12" value="4" aria-label="Batidas por compasso"></label>
    <label class="opt"><input id="rhythm-mute" type="checkbox"> <span>Silenciar o clique a partir do 3º compasso</span></label>
  </div>
  <div class="controls">
    <button id="rhythm-start" class="primary" type="button">Iniciar</button>
    <button id="rhythm-tap" type="button">Bater (ou Espaço)</button>
  </div>
  <p class="status" id="rhythm-status"></p>
  <div class="taps" id="rhythm-taps" aria-hidden="true"></div>
  <div class="stats">
    <div><b id="rhythm-last">–</b><span>último toque</span></div>
    <div><b id="rhythm-mean">–</b><span>média (+ atrasado, − adiantado)</span></div>
    <div><b id="rhythm-sd">–</b><span>regularidade</span></div>
    <div><b id="rhythm-n">0</b><span>toques</span></div>
  </div>
  <div class="form">
    <label class="opt"><span>Compensar latência</span> <input id="rhythm-latency" type="number" min="-200" max="500" value="0" aria-label="Latência em milissegundos"> <span>ms</span></label>
  </div>
</section>
