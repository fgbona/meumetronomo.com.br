server {
	listen 209.126.81.212:443 ssl http2;
	server_name meumetronomo.com.br  www.meumetronomo.com.br;
	root /home/appsec/meumetronomo.com.br/public;
	# Site estático regenerado in-place pelo hugo: sem cache de fd/stat, senão nginx serve
	# index.html truncado (Content-Length antigo) por até 120s após cada publicação.
	open_file_cache off;
	error_page 404 /404.html;
	index index.html index.htm;
	access_log /usr/local/apache/domlogs/meumetronomo.com.br.bytes bytes;
	access_log /usr/local/apache/domlogs/meumetronomo.com.br.log combined;
	error_log /usr/local/apache/domlogs/meumetronomo.com.br.error.log error;
	

	ssl_certificate      /etc/pki/tls/certs/meumetronomo.com.br.bundle;
	ssl_certificate_key  /etc/pki/tls/private/meumetronomo.com.br.key;
	ssl_protocols TLSv1.2;
	ssl_ciphers EECDH+ECDSA+AESGCM:EECDH+aRSA+AESGCM:EECDH+ECDSA+SHA384:EECDH+ECDSA+SHA256:EECDH+aRSA+SHA384:EECDH+aRSA+SHA256:EECDH+aRSA!RC4:EECDH:!RC4:!aNULL:!eNULL:!LOW:!3DES:!MD5:!EXP:!PSK:!SRP:!DSS;
	ssl_prefer_server_ciphers   on;

	ssl_session_cache   shared:SSL:10m;
	ssl_session_timeout 60m;

	# Cabeçalhos de segurança (Lighthouse "Trust & Safety"). Obs.: o Cloudflare sobrescreve o HSTS
	# com o valor configurado no painel dele (SSL/TLS > Edge Certificates > HSTS); deixe lá em 12 meses.
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	# CSP: scripts só do próprio site e dos domínios do Google (AdSense/GA4). Sem inline: o site não usa.
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.googleadservices.com https://*.adtrafficquality.google https://www.googletagmanager.com https://*.google-analytics.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

	location / {
		try_files $uri $uri/ =404;
		location ~.*\.(jpeg|jpg|png|gif|bmp|ico|svg|css|js|webp|avif|woff|woff2)$ {
			expires max;
		}
	}

	location ~* "/\.(htaccess|htpasswd)$" {deny all;return 404;}

	disable_symlinks if_not_owner from=/home/appsec/meumetronomo.com.br;

	location /.well-known/acme-challenge {
		default_type "text/plain";
		alias /usr/local/apache/autossl_tmp/.well-known/acme-challenge;
	}

	location /.well-known/pki-validation {
		default_type "text/plain";
		alias /usr/local/apache/autossl_tmp/.well-known/acme-challenge;
	}
}

