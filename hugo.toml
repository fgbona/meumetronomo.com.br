baseURL = "https://meumetronomo.com.br/"
title = "Meu Metrônomo"
defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term", "section", "rss"]
enableRobotsTXT = true
enableGitInfo = true              # lastmod real no sitemap a partir do git
disableHugoGeneratorInject = true

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[sitemap]
  changefreq = "weekly"
  priority = 0.8

[languages]
  [languages."pt-br"]
    locale = "pt-BR"
    label = "Português"
    weight = 1
    [languages."pt-br".params]
      description = "Metrônomo online simples com batidas sonoras e visuais. Defina o BPM, use o Tap BPM, ajuste o número de batidas, subdivisões e o temporizador."
  [languages.en]
    locale = "en"
    label = "English"
    weight = 2
    [languages.en.params]
      description = "Free online metronome with sound and visual beats. Set the BPM, use tap tempo, choose beats per bar, subdivisions, a practice timer and a speed trainer."

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true

[outputs]
  home = ["HTML", "LLMS"]

[params]
  # Google Analytics (GA4) — ex.: "G-XXXXXXXXXX". Vazio = desligado.
  ga = ""
  # Verificação de propriedade (Google Search Console): código do método "tag HTML". Vazio não renderiza.
  google_site_verification = ""

[minify]
  minifyOutput = true
# Mantém aspas nos atributos: verificadores (Search Console/AdSense) procuram name="..." literal.
[minify.tdewolff.html]
  keepQuotes = true

# Google AdSense — preencha client ("ca-pub-...") e os slots criados no painel. Vazio = nenhum anúncio renderizado.
[params.adsense]
  client = "ca-pub-0948876604573311"
  slotTop = ""
  slotBottom = ""
